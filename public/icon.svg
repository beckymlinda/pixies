<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bb2d3b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Glass Icon -->
  <g transform="translate(256, 256)">
    <!-- Glass cup -->
    <path d="M -60 -80 L -50 40 Q -48 60 -30 70 L 30 70 Q 48 60 50 40 L 60 -80 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,1)" stroke-width="2"/>
    
    <!-- Liquid -->
    <path d="M -50 -40 L -45 30 Q -44 45 -30 52 L 30 52 Q 44 45 45 30 L 50 -40 Z" 
          fill="rgba(255,255,255,0.6)"/>
    
    <!-- Foam -->
    <ellipse cx="0" cy="-40" rx="50" ry="8" fill="rgba(255,255,255,0.8)"/>
    <ellipse cx="0" cy="-40" rx="40" ry="6" fill="rgba(255,255,255,0.9)"/>
    
    <!-- Steam -->
    <path d="M -20 -90 Q -25 -100 -20 -110 Q -15 -120 -20 -130" 
          stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 0 -90 Q 5 -100 0 -110 Q -5 -120 0 -130" 
          stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 20 -90 Q 25 -100 20 -110 Q 15 -120 20 -130" 
          stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="white">PIXIES</text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="600" 
        text-anchor="middle" fill="rgba(255,255,255,0.9)">BAR</text>
</svg>
